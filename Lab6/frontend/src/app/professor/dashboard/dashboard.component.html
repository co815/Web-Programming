<div class="container">
  <header class="page-header">
    <h1>My Courses</h1>
    <span class="muted">{{ auth.currentUser?.full_name }}</span>
    <button class="btn btn-secondary" (click)="logout()">Log Out</button>
  </header>

  <p [class]="messageType" *ngIf="message">{{ message }}</p>

  <section class="card">
    <h2>Add Course</h2>
    <form class="inline-form" #addForm="ngForm" (ngSubmit)="addForm.valid && addCourse()">
      <input type="text" [(ngModel)]="newCourseName" name="courseName"
             placeholder="Course name" required minlength="2" maxlength="100">
      <button type="submit" class="btn" [disabled]="isSubmitting">Add</button>
    </form>
  </section>

  <section class="card">
    <h2>Course List</h2>
    <p class="muted" *ngIf="courses.length === 0">No courses yet. Add one above.</p>
    <table class="data-table" *ngIf="courses.length > 0">
      <thead>
        <tr><th>Course</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of courses">
          <td>{{ c.name }}</td>
          <td class="actions">
            <a [routerLink]="['/professor/courses', c.id, 'grades']" class="btn btn-small">
              Manage Grades
            </a>
            <button class="btn btn-small btn-danger" [disabled]="deletingId !== null" (click)="deleteCourse(c)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
